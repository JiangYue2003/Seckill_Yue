# docker-compose.mq.yml
# 消息队列：RocketMQ NameServer + Broker
#
# 启动：docker compose -f docker-compose.mq.yml up -d
# 停止：docker compose -f docker-compose.mq.yml down
#
# 本地开发模式：不使用自定义网络，通过端口映射暴露到宿主机
# 微服务连接地址：localhost:9876（NameServer）、localhost:10911（Broker）

services:
  # ============================================================
  # RocketMQ NameServer
  # ============================================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: seckill-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # RocketMQ Broker
  # Broker 内部通过容器名访问 NameServer（同一 compose 默认网络）
  # 宿主机上的微服务通过 localhost:9876 访问 NameServer
  # ============================================================
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: seckill-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    command: ["sh", "-c", "printf 'brokerClusterName=DefaultCluster\\nbrokerName=broker-a\\nbrokerId=0\\nbrokerIP1=host.docker.internal\\nnamesrvAddr=rocketmq-namesrv:9876\\nautoCreateTopicEnable=true\\nautoCreateSubscriptionGroup=true\\nstorePathRootDir=/home/rocketmq/store\\nflushDiskType=ASYNC_FLUSH\\nfileReservedTime=48\\n' > /tmp/broker.conf && sh mqbroker -c /tmp/broker.conf"]
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  rocketmq_namesrv_logs:
    driver: local
  rocketmq_broker_logs:
    driver: local
  rocketmq_broker_store:
    driver: local
