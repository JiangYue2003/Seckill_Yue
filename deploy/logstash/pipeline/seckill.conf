# Logstash Pipeline：Kafka → Elasticsearch
# 消费 seckill-logs topic，解析 go-zero JSON 日志，写入 ES 按服务分索引

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["seckill-logs"]
    group_id => "logstash-seckill"
    codec => json { charset => "UTF-8" }
    consumer_threads => 2
    decorate_events => true  # 保留 Kafka 元数据（offset、partition 等）
  }
}

filter {
  # ---- 时间字段标准化 ----
  # go-zero 输出的时间字段名为 "time"，格式为 ISO8601
  if [time] {
    date {
      match => ["time", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
      remove_field => ["time"]
    }
  }

  # ---- 日志级别字段重命名（避免和 ES 保留字冲突）----
  if [level] {
    mutate {
      rename => { "level" => "log_level" }
    }
  }

  # ---- 确保 service 字段存在（用于索引路由）----
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  # ---- 确保 instance 字段存在 ----
  if ![instance] {
    if [hostname] and [port] {
      mutate {
        add_field => { "instance" => "%{hostname}:%{port}" }
      }
    }
  }

  # ---- 去掉 Logstash 内部字段 ----
  mutate {
    remove_field => ["@version", "host", "agent", "ecs", "input", "log", "tags"]
  }
}

output {
  # 按服务名分索引，按天分片，便于管理和查询
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "seckill-logs-%{service}-%{+YYYY.MM.dd}"
    # 索引模板：确保字段类型正确
    template_name => "seckill-logs"
    template_overwrite => false
  }

  # 调试用：同时输出到 stdout（生产环境注释掉）
  # stdout {
  #   codec => rubydebug
  # }
}
