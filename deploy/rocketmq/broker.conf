# RocketMQ Broker 配置
# brokerIP1 必须是宿主机 IP，否则 Go 客户端拿到容器内网 IP 无法连接
# Windows 宿主机通常是 host.docker.internal，Linux 宿主机改为实际 IP

brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# brokerIP1：客户端（宿主机上的 Go 微服务）通过此地址连接 Broker
# Windows Docker Desktop：host.docker.internal 解析为宿主机 IP
# Linux 宿主机：改为实际 IP，如 192.168.1.100
brokerIP1=host.docker.internal

namesrvAddr=rocketmq-namesrv:9876

# 自动创建 Topic（开发环境开启，生产环境关闭）
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# 存储路径
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog

# 延迟消息级别（对应 DelayLevel 1-18）
# 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h

# 消息保留时间（小时）
fileReservedTime=48

# 刷盘方式：ASYNC_FLUSH 异步（性能好），SYNC_FLUSH 同步（可靠）
flushDiskType=ASYNC_FLUSH
