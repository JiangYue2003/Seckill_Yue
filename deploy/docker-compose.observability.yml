# docker-compose.observability.yml
# 可观测性栈：Prometheus（指标采集）+ Grafana（指标可视化）+ Jaeger（链路追踪）
#
# 启动：docker compose -f docker-compose.observability.yml up -d
# 停止：docker compose -f docker-compose.observability.yml down
#
# 访问地址：
#   Prometheus:  http://localhost:9090
#   Grafana:     http://localhost:3000  (admin/admin)
#   Jaeger UI:   http://localhost:16686
#
# 各微服务指标端口（Prometheus scrape targets）：
#   gateway:          :9180/metrics
#   seckill-service:  :9181/metrics
#   order-service:    :9182/metrics
#   product-service:  :9183/metrics
#   user-service:     :9184/metrics
#
# 链路追踪上报地址（各服务 Telemetry.Endpoint）：
#   OTLP gRPC: localhost:4317


services:
  # ============================================================
  # Prometheus（指标采集和存储）
  # 配置文件：./prometheus/prometheus.yml
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: seckill-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - seckill-net

  # ============================================================
  # Grafana（指标可视化）
  # 默认账号：admin / admin
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: seckill-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - seckill-net

  # ============================================================
  # Jaeger（分布式链路追踪）
  # 接收 OTLP gRPC（4317）和 HTTP（4318）
  # UI 访问：http://localhost:16686
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: seckill-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC（各服务 Telemetry.Endpoint 指向此端口）
      - "4318:4318"    # OTLP HTTP
      - "14268:14268"  # Jaeger HTTP collector（兼容旧版）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - seckill-net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  seckill-net:
    external: true
