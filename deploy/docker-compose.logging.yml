# docker-compose.logging.yml
# 日志采集栈：Kafka（缓冲）+ Logstash（消费/转换）+ Elasticsearch（存储）+ Kibana（查询）
#
# 启动：docker compose -f docker-compose.logging.yml up -d
# 停止：docker compose -f docker-compose.logging.yml down
#
# 日志流向：
#   服务 stdout (JSON) → Filebeat（宿主机） → Kafka → Logstash → Elasticsearch → Kibana
#
# Filebeat 在宿主机上独立运行，配置见 filebeat/filebeat.yml
# Kibana 访问地址：http://localhost:5601

version: '3.8'

services:
  # ============================================================
  # Kafka（KRaft 模式，无需 ZooKeeper）
  # 用途：日志缓冲，防止日志洪峰直接打垮 Elasticsearch
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: seckill-kafka-log
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      TZ: Asia/Shanghai
    volumes:
      - kafka_log_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - seckill-net

  # ============================================================
  # Elasticsearch（日志存储和全文索引）
  # 索引命名：seckill-logs-{service}-{YYYY.MM.dd}
  # ============================================================
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: seckill-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - seckill-net

  # ============================================================
  # Kibana（日志查询和可视化）
  # 访问：http://localhost:5601
  # 创建 index pattern：seckill-logs-*
  # ============================================================
  kibana:
    image: kibana:8.13.0
    container_name: seckill-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TZ: Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - seckill-net

  # ============================================================
  # Logstash（Kafka 消费者，日志解析和路由到 ES）
  # Pipeline 配置：./logstash/pipeline/seckill.conf
  # ============================================================
  logstash:
    image: logstash:8.13.0
    container_name: seckill-logstash
    restart: unless-stopped
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      TZ: Asia/Shanghai
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - seckill-net

volumes:
  kafka_log_data:
    driver: local
  es_data:
    driver: local

networks:
  seckill-net:
    external: true
