version: '3.8'

# ============================================================
# 此文件已拆分为四个独立的 compose 文件，按需启动：
#
#   基础设施（etcd + MySQL + Redis）：
#     docker compose -f docker-compose.infra.yml up -d
#
#   消息队列（RocketMQ NameServer + Broker）：
#     docker compose -f docker-compose.mq.yml up -d
#
#   日志采集栈（Kafka + Logstash + Elasticsearch + Kibana）：
#     docker compose -f docker-compose.logging.yml up -d
#
#   可观测性栈（Prometheus + Grafana + Jaeger）：
#     docker compose -f docker-compose.observability.yml up -d
#
# 启动顺序：infra → mq → logging/observability（后两者无依赖顺序）
#
# 一键启动全部（开发环境）：
#   docker compose -f docker-compose.infra.yml \
#                  -f docker-compose.mq.yml \
#                  -f docker-compose.logging.yml \
#                  -f docker-compose.observability.yml \
#                  up -d
#
# 注意：所有文件共享同一个 Docker 网络 seckill-net，
#       由 docker-compose.infra.yml 负责创建，其余文件声明 external: true。
# ============================================================

# 此文件不包含任何服务定义，仅作为入口说明文档。
services: {}
