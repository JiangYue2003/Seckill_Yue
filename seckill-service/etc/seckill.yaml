Name: seckill.rpc
ListenOn: 127.0.0.1:9083
Mode: pro
Log:
  ServiceName: seckill.rpc
  Mode: file     # 容器环境建议改为 volume 并挂载目录
  Path: logs/seckill-service
  Level: info
  Compress: true
  KeepDays: 14
  StackCooldownMillis: 100
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: seckill.rpc

# 链路追踪（上报到 Jaeger OTLP gRPC）
Telemetry:
  Name: seckill.rpc
  Endpoint: localhost:4317
  Sampler: 0.1
  Batcher: otlpgrpc

# Prometheus 指标暴露
Prometheus:
  Host: 0.0.0.0
  Port: 9183
  Path: /metrics

Redis:
  Host: localhost:6379
  Key: seckill.rpc.auth

SeckillRedis:
  Host: localhost:6379
  PoolSize: 128
  MinIdleConns: 16
  DialTimeoutMs: 1000
  ReadTimeoutMs: 1000
  WriteTimeoutMs: 1000
  PoolTimeoutMs: 1000

ProductMetaCache:
  Enabled: true
  RefreshSeconds: 3
  ScanCount: 500

Bloom:
  Enabled: true
  ExpectedItems: 50000
  FalsePositiveRate: 0.001
  NegativeCacheTTLSeconds: 5
  FallbackVerifyEnabled: true

RabbitMQ:
  URL: amqp://guest:guest@localhost:5672/
  Exchange: seckill_exchange
  RoutingKey: seckill.order

AsyncProducer:
  BufferSize: 10000
  WorkerCount: 16
  RetryCount: 3
  RetryInterval: 1

LocalQuota:
  Enabled: true
  BatchSize: 2000
  LowWatermark: 400
  LeaseTTLSeconds: 30
  HeartbeatSeconds: 10
  ReaperIntervalSeconds: 5
