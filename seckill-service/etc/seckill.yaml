Name: seckill.rpc
ListenOn: 127.0.0.1:9083
Mode: dev
MaxConns: 100000   # 最大并发连接数，默认 10000，高并发压测需要调大
Timeout: 10000     # 请求超时 10s，压测时避免 DeadlineExceeded
Log:
  ServiceName: seckill.rpc
  Mode: console     # 容器环境建议改为 volume 并挂载目录
  Path: logs/seckill-service
  Level: info
  Compress: true
  KeepDays: 14
  StackCooldownMillis: 100
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: seckill.rpc

# 链路追踪（上报到 Jaeger OTLP gRPC）
Telemetry:
  Name: seckill.rpc
  Endpoint: localhost:4317
  Sampler: 0.1
  Batcher: otlpgrpc

# Prometheus 指标暴露
Prometheus:
  Host: 0.0.0.0
  Port: 9183
  Path: /metrics

MySQL:
  DataSource: root:Zz123456@tcp(localhost:3306)/seckill_mall?charset=utf8mb4&parseTime=True&loc=Local

Redis:
  Host: localhost:6379
  Key: seckill.rpc.auth

SeckillRedis:
  Mode: single          # single(默认) | cluster | sentinel
  Addr: localhost:6379  # single/sentinel 模式使用
  # cluster/sentinel 模式示例：
  # Mode: cluster
  # Addrs:
  #   - localhost:7001
  #   - localhost:7002
  #   - localhost:7003
  PoolSize: 128
  MinIdleConns: 16
  DialTimeoutMs: 1000
  ReadTimeoutMs: 1000
  WriteTimeoutMs: 1000
  PoolTimeoutMs: 1000

ProductMetaCache:
  Enabled: true
  RefreshSeconds: 3
  ScanCount: 500

Bloom:
  Enabled: true
  ExpectedItems: 50000
  FalsePositiveRate: 0.001
  NegativeCacheTTLSeconds: 5
  FallbackVerifyEnabled: true

RocketMQ:
  NameServer: 127.0.0.1:9876
  ProducerGroup: seckill_producer
  OrderTopic: seckill_order
  CheckTopic: seckill_order_check

AsyncProducer:
  BufferSize: 10000
  WorkerCount: 16
  RetryCount: 3
  RetryInterval: 1

LocalQuota:
  Enabled: true
  BatchSize: 5000      # 调大批次，减少补充频率（原 2000）
  LowWatermark: 1000   # 低水位对应调大（原 400）
  LeaseTTLSeconds: 30
  HeartbeatSeconds: 10
  ReaperIntervalSeconds: 5
