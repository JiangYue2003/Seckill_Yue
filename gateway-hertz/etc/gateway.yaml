Name: gateway-hertz
Host: 0.0.0.0
Port: 8889
Mode: dev

MetricsPort: 9181

JWT:
  AccessSecret: seckill-mall-jwt-secret-key-2026
  AccessExpire: 900
  RefreshSecret: seckill-mall-jwt-refresh-secret-key-2026
  RefreshExpire: 604800

RedisHost: localhost:6379

# 链路追踪（上报到 Jaeger OTLP gRPC）
Telemetry:
  Endpoint: localhost:4317
  Sampler: 0.1
  Disabled: true  # 本地开发可关闭

# 限流配置（秒杀接口）
RateLimit:
  Enabled: false
  Strategy: token_bucket
  QPS: 200
  Capacity: 500

# gRPC 服务（通过 etcd 服务发现）
UserService:
  NonBlock: false
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

ProductService:
  NonBlock: false
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: product.rpc

SeckillService:
  NonBlock: false
  Timeout: 3000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: seckill.rpc

OrderService:
  NonBlock: false
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: order.rpc
