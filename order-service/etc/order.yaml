Name: order.rpc
ListenOn: 127.0.0.1:9084
Mode: dev
Dev:
  ResetLogsOnStart: true # 仅在 Mode=dev/test 且该值=true 时，启动前清空日志目录

Log:
  ServiceName: order.rpc
  Mode: console     # 容器环境建议改为 volume 并挂载目录
  Path: logs/order-service
  Level: info
  Compress: true
  KeepDays: 14
  StackCooldownMillis: 100
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: order.rpc

# 链路追踪
Telemetry:
  Name: order.rpc
  Endpoint: localhost:4317
  Sampler: 0.1
  Batcher: otlpgrpc

# Prometheus 指标暴露
Prometheus:
  Host: 0.0.0.0
  Port: 9184
  Path: /metrics

MySQL:
  DataSource: root:Zz123456@tcp(localhost:3306)/seckill_mall?charset=utf8mb4&parseTime=True&loc=Local

MyCache:
  - Host: localhost:6379
    Type: node

RocketMQ:
  NameServer: localhost:9876
  OrderConsumerGroup: seckill_order_consumer
  CheckConsumerGroup: seckill_check_consumer
  DLQConsumerGroup: seckill_dlq_consumer
  OrderTopic: seckill_order
  CheckTopic: seckill_order_check

# Product Service gRPC（通过 etcd发现）
ProductService:
  NonBlock: false
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: product.rpc

# Seckill Service gRPC（通过 etcd发现）
SeckillService:
  NonBlock: false
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: seckill.rpc

# etcd 不可用时的 fallback 直连地址（90XX 端口）
Fallback:
  ProductServiceEndpoint: 127.0.0.1:9082
  SeckillServiceEndpoint: 127.0.0.1:9083
